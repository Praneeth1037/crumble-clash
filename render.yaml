# One-click Render setup for the Crumble Clash online room server (it also serves the game itself).
services:
  - type: web
    name: crumble-clash
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
